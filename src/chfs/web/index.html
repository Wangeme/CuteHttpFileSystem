<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CHFS 文件空间</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="CHFS 首页">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span><strong>CHFS</strong><small>文件空间</small></span>
      </a>
      <div class="session-area">
        <span id="connectionState" class="connection"><span class="status-dot"></span>服务在线</span>
        <button id="loginButton" class="button button-quiet" type="button">登录</button>
      </div>
    </header>

    <main class="workspace">
      <section class="heading-row">
        <div>
          <p class="eyebrow">共享目录</p>
          <h1>文件</h1>
          <nav id="breadcrumbs" class="breadcrumbs" aria-label="当前位置"></nav>
        </div>
        <div class="primary-actions">
          <input id="filePicker" type="file" multiple hidden>
          <input id="folderPicker" type="file" webkitdirectory multiple hidden>
          <button id="newFolderButton" class="button button-secondary" type="button">新建文件夹</button>
          <button id="uploadButton" class="button button-primary" type="button">上传文件</button>
          <button id="uploadFolderButton" class="button button-secondary" type="button">上传文件夹</button>
        </div>
      </section>

      <section class="text-panel" aria-labelledby="sharedTextTitle">
        <div class="text-panel-heading">
          <div>
            <p class="eyebrow">跨设备剪贴板</p>
            <h2 id="sharedTextTitle">共享文本</h2>
          </div>
          <div class="text-actions">
            <button id="copyTextButton" class="button button-quiet" type="button">复制</button>
            <button id="pasteTextButton" class="button button-secondary" type="button">粘贴</button>
            <button id="clearTextButton" class="button button-danger" type="button">清空</button>
            <button id="refreshTextButton" class="button button-secondary" type="button">刷新</button>
          </div>
        </div>
        <textarea id="sharedText" rows="6" maxlength="1048576" spellcheck="false"
          placeholder="在手机或电脑粘贴文本，停止输入后会自动同步。"></textarea>
        <div class="text-meta">
          <span id="sharedTextStatus">正在读取…</span>
          <span id="sharedTextCount">0 字符</span>
        </div>
      </section>

      <section id="dropZone" class="file-panel" aria-live="polite">
        <div class="location-toolbar">
          <div class="space-switch" aria-label="文件空间">
            <button id="sharedSpaceButton" class="location-button active" type="button">共享目录</button>
            <button id="computerSpaceButton" class="location-button" type="button" hidden>此电脑</button>
            <button id="homeButton" class="location-button" type="button" hidden>主目录</button>
          </div>
          <div id="quickAccess" class="quick-access" aria-label="快速访问" hidden>
            <span>快速访问</span>
            <div id="quickAccessButtons" class="quick-access-buttons"></div>
          </div>
        </div>
        <div class="file-toolbar">
          <div class="file-commands">
            <button id="parentButton" class="button button-quiet" type="button">上一级</button>
            <button id="copyFilesButton" class="button button-quiet" type="button" disabled>复制</button>
            <button id="cutFilesButton" class="button button-quiet" type="button" disabled>剪切</button>
            <button id="pasteFilesButton" class="button button-quiet" type="button" disabled>粘贴</button>
            <button id="deleteFilesButton" class="button button-danger" type="button" disabled>删除</button>
          </div>
          <div class="file-toolbar-status">
            <div id="itemCount" class="item-count">正在读取…</div>
            <button id="refreshButton" class="button button-quiet" type="button">刷新</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th class="selection-column"><input id="selectAllFiles" type="checkbox" aria-label="全选"></th><th>名称</th><th>大小</th><th>修改时间</th><th><span class="sr-only">操作</span></th></tr></thead>
            <tbody id="fileRows"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state" hidden>
          <strong>这个文件夹是空的</strong>
          <span>拖放文件到这里，或使用“上传文件”。</span>
        </div>
        <div id="loadingState" class="loading-state">正在加载文件…</div>
      </section>
    </main>
  </div>

  <dialog id="loginDialog" class="dialog">
    <form id="loginForm" method="dialog">
      <div class="dialog-heading"><div><p class="eyebrow">账户访问</p><h2>登录 CHFS</h2></div><button class="close-button" value="cancel" aria-label="关闭" type="submit">关闭</button></div>
      <label>用户名<input id="usernameInput" name="username" autocomplete="username" required></label>
      <label>密码<input id="passwordInput" name="password" type="password" autocomplete="current-password" required></label>
      <p id="loginError" class="form-error" role="alert"></p>
      <button class="button button-primary button-full" value="default" type="submit">登录</button>
    </form>
  </dialog>

  <dialog id="folderDialog" class="dialog">
    <form id="folderForm" method="dialog">
      <div class="dialog-heading"><div><p class="eyebrow">新建目录</p><h2>创建文件夹</h2></div><button class="close-button" value="cancel" aria-label="关闭" type="submit">关闭</button></div>
      <label>文件夹名称<input id="folderNameInput" autocomplete="off" maxlength="120" required></label>
      <p id="folderError" class="form-error" role="alert"></p>
      <button class="button button-primary button-full" value="default" type="submit">创建</button>
    </form>
  </dialog>

  <dialog id="uploadConflictDialog" class="dialog">
    <form id="uploadConflictForm" method="dialog">
      <div class="dialog-heading">
        <div><p class="eyebrow">上传冲突</p><h2>文件已存在</h2></div>
        <button class="close-button" value="skip" aria-label="关闭并跳过" type="submit">关闭</button>
      </div>
      <p id="uploadConflictPath" class="conflict-path"></p>
      <label class="dialog-checkbox">
        <input id="applyConflictChoice" type="checkbox">
        <span>后续同名文件也这样处理</span>
      </label>
      <div class="dialog-actions">
        <button class="button button-secondary" value="skip" type="submit">跳过</button>
        <button class="button button-primary" value="overwrite" type="submit">覆盖</button>
      </div>
    </form>
  </dialog>

  <div id="uploadTray" class="upload-tray" hidden>
    <div class="upload-heading"><strong id="uploadTitle">正在上传</strong><span id="uploadCounter">1 / 1</span></div>
    <div class="upload-meta"><span id="uploadDetail"></span><span id="uploadSpeed">0 B/s</span></div>
    <progress id="uploadProgress" value="0" max="100"></progress>
    <div class="upload-overall"><span>全部文件</span><span id="uploadOverallText">0%</span></div>
    <progress id="uploadOverallProgress" value="0" max="100"></progress>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/assets/app.js" type="module"></script>
</body>
</html>
