name: 验证 Windows 构建

on:
  pull_request:
  workflow_dispatch:

# 正式版本按 docs/08-release-checklist.md 在维护者 Windows 环境构建并发布；
# 此工作流只验证测试和打包，避免生成一个与本地验收版本不同的附件。
permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试并构建
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v6

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: 安装项目并运行测试
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m unittest discover -s tests -v

      - name: 构建 Windows 单文件程序
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE "dist"
          & "$env:GITHUB_WORKSPACE\scripts\build_exe.ps1" -OutputDirectory $outputDirectory

      - name: 整理验证产物
        shell: pwsh
        run: |
          $distDirectory = Join-Path $env:GITHUB_WORKSPACE "dist"
          $sourceExe = Join-Path $distDirectory "CHFS.exe"
          $releaseExe = Join-Path $distDirectory "CHFS-Windows-x64.exe"
          if (-not (Test-Path -LiteralPath $sourceExe)) {
              throw "构建完成后没有找到 CHFS.exe"
          }

          Copy-Item -LiteralPath $sourceExe -Destination $releaseExe -Force
          $hash = (Get-FileHash -LiteralPath $releaseExe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CHFS-Windows-x64.exe" | Set-Content -LiteralPath (Join-Path $distDirectory "SHA256SUMS.txt") -Encoding ascii

      - name: 保存构建产物
        uses: actions/upload-artifact@v6
        with:
          name: CHFS-Windows-x64
          path: |
            dist/CHFS-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
