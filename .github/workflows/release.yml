name: 构建 Windows Release

on:
  # Pull Request 和手动运行只负责验证构建，不会创建 Release。
  pull_request:
  workflow_dispatch:
  push:
    tags:
      # 仅正式版本标签触发，例如 v0.1.0、v1.2.3。
      - "v[0-9]+.[0-9]+.[0-9]+"

# 创建 GitHub Release 和上传附件需要仓库内容写权限。
permissions:
  contents: write

# 同一个标签只允许一个发布任务运行，避免生成重复 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: 测试、构建并发布
    runs-on: windows-latest

    steps:
      - name: 检出标签对应的源码
        uses: actions/checkout@v6

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: 安装项目并运行测试
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m unittest discover -s tests -v

      - name: 构建 Windows 单文件程序
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE "dist"
          & "$env:GITHUB_WORKSPACE\scripts\build_exe.ps1" -OutputDirectory $outputDirectory

      - name: 整理发布文件并生成 SHA-256
        shell: pwsh
        run: |
          $distDirectory = Join-Path $env:GITHUB_WORKSPACE "dist"
          $sourceExe = Join-Path $distDirectory "CHFS.exe"
          $releaseExe = Join-Path $distDirectory "CHFS-Windows-x64.exe"
          $checksumFile = Join-Path $distDirectory "SHA256SUMS.txt"

          if (-not (Test-Path -LiteralPath $sourceExe)) {
              throw "构建完成后没有找到 CHFS.exe"
          }

          Copy-Item -LiteralPath $sourceExe -Destination $releaseExe -Force
          $hash = (Get-FileHash -LiteralPath $releaseExe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CHFS-Windows-x64.exe" | Set-Content -LiteralPath $checksumFile -Encoding ascii

      - name: 保存构建产物
        uses: actions/upload-artifact@v6
        with:
          name: CHFS-Windows-x64
          path: |
            dist/CHFS-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 创建 Release 并上传程序
        # Pull Request 和手动验证不会发布；只有 v* 标签触发时才执行。
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $distDirectory = Join-Path $env:GITHUB_WORKSPACE "dist"
          $releaseExe = Join-Path $distDirectory "CHFS-Windows-x64.exe"
          $checksumFile = Join-Path $distDirectory "SHA256SUMS.txt"

          gh release create $tag `
            $releaseExe `
            $checksumFile `
            --verify-tag `
            --generate-notes `
            --notes "新增：Web 端支持上传文件夹并保留目录结构。已知限制：手机浏览器一次选择大量文件时可能因浏览器或系统资源限制而失败，建议分批上传。" `
            --title "CHFS $tag"
